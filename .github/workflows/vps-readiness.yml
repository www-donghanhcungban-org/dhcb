name: VPS readiness
on:
  workflow_dispatch:
    inputs:
      run_canary:
        description: Rehearse an isolated loopback rollout and rollback on the VPS
        type: boolean
        default: false

permissions: {}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require pinned VPS host key
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: test -n "$VPS_SSH_FINGERPRINT"
      - name: Check runtime health or rehearse the isolated canary
        env:
          DHCB_OPS_MODE: ${{ inputs.run_canary && 'canary' || 'readiness' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DHCB_OPS_MODE
          command_timeout: 1m
          script: |
            set -eu
            if [ "$DHCB_OPS_MODE" = canary ]; then
              exec python3 -I - <<'PYTHON'
            import hashlib
            import json
            import os
            from pathlib import Path
            import signal
            import tempfile
            import threading
            from http.server import BaseHTTPRequestHandler, HTTPServer
            from urllib.request import ProxyHandler, build_opener


            def stop(signum, _frame):
                raise SystemExit(128 + signum)


            for signum in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP):
                signal.signal(signum, stop)

            with tempfile.TemporaryDirectory(prefix="dhcb-canary-", dir="/tmp") as work:
                root = Path(work)
                active = root / "active"
                candidates = {}
                for name, note in (("A", "ghi-chu-mau"), ("B", "")):
                    data = json.dumps({"build": name, "note": note}, sort_keys=True).encode()
                    digest = hashlib.sha256(data).hexdigest()
                    artifact = root / digest
                    artifact.write_bytes(data)
                    artifact.chmod(0o400)
                    candidates[name] = digest

                class Sample(BaseHTTPRequestHandler):
                    timeout = 3

                    def do_GET(self):
                        if self.path != "/sample":
                            self.send_error(404)
                            return
                        data = active.read_bytes()
                        self.send_response(200)
                        self.send_header("Content-Type", "application/json")
                        self.send_header("Content-Length", str(len(data)))
                        self.end_headers()
                        self.wfile.write(data)

                    def log_message(self, *args):
                        pass

                events = []
                with HTTPServer(("127.0.0.1", 0), Sample) as server:
                    worker = threading.Thread(target=server.serve_forever, kwargs={"poll_interval": 0.05}, daemon=True)
                    worker.start()
                    try:
                        origin = "http://127.0.0.1:" + str(server.server_port)
                        client = build_opener(ProxyHandler({}))

                        def activate(name):
                            expected = candidates[name]
                            pending = root / "next"
                            pending.symlink_to(expected)
                            os.replace(pending, active)
                            with client.open(origin + "/sample", timeout=3) as response:
                                data = response.read()
                            observed = hashlib.sha256(data).hexdigest()
                            if observed != expected:
                                raise RuntimeError("HTTP bytes differ from the selected immutable artifact")
                            ok = json.loads(data)["note"] == "ghi-chu-mau"
                            events.append({"candidate": name, "served_sha256": observed, "sample_ok": ok})
                            return ok

                        if not activate("A"):
                            raise RuntimeError("Baseline failed its sample request")
                        if activate("B"):
                            raise RuntimeError("The deliberate business regression was not detected")
                        if not activate("A"):
                            raise RuntimeError("Restored artifact failed its sample request")
                    finally:
                        server.shutdown()
                        worker.join()

            if root.exists():
                raise RuntimeError("Temporary canary directory was not removed")
            print("CANARY_RECEIPT " + json.dumps({"scope": "synthetic VPS loopback", "events": events, "cleaned": True}))
            PYTHON
            fi
            cd /var/www/dhcb
            echo "Checkout $(git rev-parse --short=12 HEAD)"
            if command -v node >/dev/null 2>&1; then node --version; else echo 'node: missing'; fi
            if command -v npm >/dev/null 2>&1; then npm --version; else echo 'npm: missing'; fi
            ready=false
            if command -v node >/dev/null 2>&1 && node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 24 ? 0 : 1)'; then ready=true; fi
            for binary in "$HOME"/.nvm/versions/node/v24.*/bin/node /opt/node-v24.*/bin/node; do
              if [ -x "$binary" ]; then printf 'Installed alternative: '; "$binary" --version; fi
            done
            printf 'Deployment runtime meets Node >=24: %s\n' "$ready"
            status=$(curl --silent --show-error --max-time 8 --noproxy '*' --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/health)
            printf 'Local app health HTTP %s\n' "$status"
            test "$status" = 200
            test "$ready" = true
